[package]
name = "fluere"
version = "0.8.1"
authors = ["Skuld Norniern <skuldnorniern@gmail.com>"]
edition = "2024"
description = "Cross-platform packet capture and network flow analysis, producing FluereFlow records from live traffic or pcap files"
readme = "README.md"
license = "Apache-2.0"
keywords = ["fluereflow", "packet-capture", "cross-platform", "network-monitoring", "network-security"]
categories = ["network-programming"]
repository = "https://github.com/SkuldNorniern/fluere"

[dependencies]
clap = { version = "4.0.32", features = ["cargo"] }
tokio = { version = "1.40", features = ["full", "macros", "rt-multi-thread"] }

# using custom forked version of pcap-rs for fixing audits
# pcap = { version = "1.1.0", git = "https://github.com/SkuldNorniern/pcap", rev = "40f1163" }

pcap = "2.3.0"

chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
csv = "1.3"

paccel = "0.2.0"

fluere_plugin = { version = "0.8.1", path = "./fluere-plugin", default-features = false, features = ["log"] }
fluere-config = { version = "0.4.0", path = "./fluere-config", features = ["log"] }
fluereflow = { version = "0.8.0", path = "./fluereflow" }

ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = "0.29"
log = { version = "0.4", features = ["std"]}
indicatif = "0.18"

[lints.clippy]
unwrap_used = "deny"
cognitive_complexity = "deny"

[features]
default = ["plugins"]
# Plugin support. Off, the Lua interpreter and its vendored C sources are not
# built at all; the plugin manager stays, and reports that no runtime can load
# a configured plugin.
plugins = ["fluere_plugin/lua"]

[workspace]
members = [
  "fluere-plugin",
  "fluere-config",
  "fluereflow",
]

[package.metadata.rpm]
package = "fluere"

[package.metadata.rpm.cargo]
buildflags = ["--release"]

[package.metadata.rpm.targets]
fluere = { path = "/usr/bin/fluere" }

[package.metadata.generate-rpm.requires]
libpcap = "*"
openssl = "*"

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/fluere", dest = "/usr/bin/fluere", mode = "755" },
]

[profile.release]
lto = 'fat'
opt-level = 3
