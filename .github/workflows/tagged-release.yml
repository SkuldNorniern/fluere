name: tagged-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The tag is the release, so it gets checked on every platform the README
  # claims before anything is published. The old version tested on Ubuntu and
  # attached no binaries at all.
  check:
    name: check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install libpcap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install Npcap SDK
        if: runner.os == 'Windows'
        run: |
          curl -L -o npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.13.zip
          unzip -q npcap-sdk.zip -d $env:GITHUB_WORKSPACE\npcap-sdk
          echo "LIB=$env:GITHUB_WORKSPACE\npcap-sdk\Lib\x64" >> $env:GITHUB_ENV

      # See the note in rust.yml: Windows has no capture runtime to load, so
      # the tests are compiled there rather than run.
      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test --workspace --verbose

      - name: Build tests
        if: runner.os == 'Windows'
        run: cargo test --workspace --no-run --verbose

      - run: cargo build --release --no-default-features --verbose

      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --release --verbose -- -D warnings

  linux:
    name: linux packages
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: cargo install cargo-deb cargo-generate-rpm

      - run: cargo build --release
      - run: strip -s target/release/fluere

      - name: Build deb and rpm
        run: |
          cargo deb
          cargo generate-rpm

      - name: Archive the binary
        run: |
          tar -czf fluere-${{ github.ref_name }}-x86_64-linux.tar.gz -C target/release fluere
          sha256sum fluere-${{ github.ref_name }}-x86_64-linux.tar.gz > fluere-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            fluere-*.tar.gz
            fluere-*.sha256

  macos:
    name: macos archive
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release
      - name: Archive the binary
        run: |
          tar -czf fluere-${{ github.ref_name }}-arm64-macos.tar.gz -C target/release fluere
          shasum -a 256 fluere-${{ github.ref_name }}-arm64-macos.tar.gz > fluere-${{ github.ref_name }}-arm64-macos.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            fluere-*.tar.gz
            fluere-*.sha256

  windows:
    name: windows archive
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Npcap SDK
        run: |
          curl -L -o npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.13.zip
          unzip -q npcap-sdk.zip -d $env:GITHUB_WORKSPACE\npcap-sdk
          echo "LIB=$env:GITHUB_WORKSPACE\npcap-sdk\Lib\x64" >> $env:GITHUB_ENV

      - run: cargo build --release
      - name: Archive the binary
        run: |
          Compress-Archive -Path target\release\fluere.exe -DestinationPath fluere-${{ github.ref_name }}-x86_64-windows.zip
          (Get-FileHash fluere-${{ github.ref_name }}-x86_64-windows.zip -Algorithm SHA256).Hash.ToLower() + "  fluere-${{ github.ref_name }}-x86_64-windows.zip" | Out-File -Encoding ascii fluere-${{ github.ref_name }}-x86_64-windows.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            fluere-*.zip
            fluere-*.sha256

  release:
    name: publish the release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Groups the changelog by conventional-commit type rather than dumping a
      # flat list of every commit, which is what GitHub's own note generator
      # does.
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          title: "Fluere ${{ github.ref_name }}"
          # Recursive: upload-artifact keeps the common directory prefix of
          # each path pattern, so the deb and rpm arrive under their own
          # subdirectories rather than flat.
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256

      - name: Append install notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF_NAME}
          VERSION=${TAG#v}
          CURRENT=$(gh release view "$TAG" --json body --jq '.body')
          NOTES=$(mktemp)
          {
            echo "$CURRENT"
            echo ""
            echo "---"
            echo ""
            echo "### Install"
            echo ""
            echo '```sh'
            echo "cargo install fluere --version ${VERSION}"
            echo '```'
            echo ""
            echo "Needs libpcap on Linux and macOS, or Npcap in WinPcap-compatible mode on Windows."
            echo "Capturing needs privileges; converting a pcap file does not."
            echo ""
            echo "### Downloads"
            echo ""
            echo "| File | Platform |"
            echo "|------|----------|"
            echo "| \`fluere_${VERSION}-1_amd64.deb\` | Debian, Ubuntu |"
            echo "| \`fluere-${VERSION}-1.x86_64.rpm\` | Fedora, RHEL |"
            echo "| \`fluere-${TAG}-x86_64-linux.tar.gz\` | Linux x86_64 |"
            echo "| \`fluere-${TAG}-arm64-macos.tar.gz\` | macOS arm64 |"
            echo "| \`fluere-${TAG}-x86_64-windows.zip\` | Windows x86_64 |"
            echo ""
            echo "Verify a download: \`sha256sum -c <file>.sha256\`"
            echo ""
            echo "### Documentation"
            echo ""
            echo "[Usage](https://github.com/SkuldNorniern/fluere/wiki/Usage) - the commands and their options  "
            echo "[Format](https://github.com/SkuldNorniern/fluere/wiki/Format) - what a flow record contains  "
            echo "[Migrating from 0.7](https://github.com/SkuldNorniern/fluere/wiki/Migrating-from-0.7) - for existing scripts and plugins"
          } > "$NOTES"
          gh release edit "$TAG" --notes-file "$NOTES"
