name: rustfmt

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  fmt:
    name: check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Checks only. The old version ran `cargo fmt` and pushed the result back
      # with write-all permissions, which is a lot of trust for a lint.
      - run: cargo fmt --all -- --check
