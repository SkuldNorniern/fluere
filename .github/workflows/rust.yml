name: Build Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # libpcap on Linux, already present on macOS, Npcap SDK on Windows.
      - name: Install libpcap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install Npcap SDK
        if: runner.os == 'Windows'
        run: |
          curl -L -o npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.13.zip
          unzip -q npcap-sdk.zip -d $env:GITHUB_WORKSPACE\npcap-sdk
          echo "LIB=$env:GITHUB_WORKSPACE\npcap-sdk\Lib\x64" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --verbose

      # The build the README offers for anyone who does not want Lua.
      - name: Build without a plugin runtime
        run: cargo build --release --no-default-features --verbose

      # Windows links against the Npcap SDK's import library, but running
      # anything needs the Npcap runtime DLL, which is not on the runner and
      # whose redistribution terms make installing it in CI awkward. Compile
      # the tests there and run them where a capture library is present.
      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test --workspace --verbose

      - name: Build tests
        if: runner.os == 'Windows'
        run: cargo test --workspace --no-run --verbose

      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --release --verbose -- -D warnings

  audit:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # cargo-audit directly rather than rustsec/audit-check, which wants
      # `checks: write` to post a check run and fails the job without it even
      # when it found nothing. This fails on an actual vulnerability and
      # reports unmaintained and unsound crates without failing on them.
      - run: cargo install cargo-audit --locked
      - run: cargo audit
